        <button #menuToggle data-collapse-toggle="navbar-sticky" type="button" class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600" aria-controls="navbar-sticky" aria-expanded="false">
          <span class="sr-only">Open main menu</span>
          <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15"/>
          </svg>
      </button>
    </div>
    <div class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1" id="navbar-sticky">
      <ul class="flex flex-col p-4 md:p-0 mt-4 font-medium border border-gray-100 rounded-lg bg-gray-50 md:space-x-8 rtl:space-x-reverse md:flex-row md:mt-0 md:border-0 md:bg-white dark:bg-gray-800 md:dark:bg-gray-800 dark:border-gray-700">
        <li>
          <a [routerLink]="['/welcome']" routerLinkActive="md:py-2 md:px-3 text-white bg-blue-700 rounded-lg md:bg-transparent md:text-blue-700 md:p-0 md:dark:text-blue-500"
          class="block py-2 px-3 text-gray-900 rounded-lg md:hover:bg-transparent md:hover:text-blue-700 md:p-0 md:dark:hover:text-blue-500 dark:text-white dark:hover:text-white md:dark:hover:bg-transparent dark:border-gray-700">
          Welcome
          </a>
        </li>
        @for (item of menuItems; track $index) {
          <li>
            <a [routerLink]="[item.path]" (click)="closeMenu()" routerLinkActive="md:py-2 md:px-3 text-white bg-blue-700 rounded-lg md:bg-transparent md:text-blue-700 md:p-0 md:dark:text-blue-500"
            class="block py-2 px-3 text-gray-900 rounded-lg md:hover:bg-transparent md:hover:text-blue-700 md:p-0 md:dark:hover:text-blue-500 dark:text-white dark:hover:text-white md:dark:hover:bg-transparent dark:border-gray-700">
            {{ item.title }}</a>
          </li>
        }
      </ul>
