@if (isLoading()) {
  <div style="padding: 100px 20px 20px 20px;" class="h-screen overflow-y-scroll bg-white dark:bg-gray-800 w-full">
      @for (n of itemBySlug(); track $index) {
        <div class="pt-5">
          <div class="h-56 md:h-96 flex items-center justify-center bg-gray-200 rounded-lg animate-pulse"></div>
        </div>
      }

  </div>
}@else {
  <app-work-details-list [itemBySlugList]="itemBySlug()"></app-work-details-list>
}
