@if (isLoading()) {
  <div style="padding: 110px 20px 20px 20px;" class="h-screen overflow-y-scroll bg-white dark:bg-gray-800 w-full">
    <div class="grid sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-3 gap-4">
      @for (work of workCharacter(); track $index) {
        <shared-skeleton-loader [heightImg]="'64'"></shared-skeleton-loader>
      }
    </div>
  </div>
}@else {
  <app-work-list [workList]="workCharacter()"></app-work-list>
}
